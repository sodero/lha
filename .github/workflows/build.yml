name: AmigaOS4/AROS/MorphOS build

on:
  push:
    branches: [ amiga ]
  pull_request:
    branches: [ amiga ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.build-type }} - ${{ matrix.platform.name }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform:
          - name: AmigaOS4
            image: rolfkopman/os4env
            mount: /opt/code
            cfg: --host=ppc-amigaos --disable-iconv --with-tmp-file=no --with-additional-suffixes="lha," CFLAGS="-D_XOPEN_SOURCE -DUSE_OLD_ANCHORPATH -D__USE_INLINE__ -DEXPAND_WILDCARDS -D__VER__=$TAG -D__DAY__=$DAY"
          - name: AROS i386 ABI V0
            image: rolfkopman/arosi386v0env
            mount: /opt/code
            cfg: --host=i386-aros --disable-iconv --disable-largefile --with-tmp-file=no --with-additional-suffixes="lha," CFLAGS="-DEXPAND_WILDCARDS -D__VER__=$TAG -D__DAY__=$DAY"
          - name: AROS x86_64 ABI V1
            image: rolfkopman/arosx64v1env
            mount: /opt/code
            cfg: --host=x86_64-aros --disable-iconv --disable-largefile --with-tmp-file=no --with-additional-suffixes="lha," CFLAGS="-DEXPAND_WILDCARDS -D__VER__=$TAG -D__DAY__=$DAY"
          - name: MorphOS
            image: rolfkopman/mosenv
            mount: /gg/code
            cfg: --host=ppc-morphos --disable-iconv --with-tmp-file=no --with-additional-suffixes="lha," CFLAGS="-D__IXEMUL_EXEC_MIXING_ALLOWED -DEXPAND_WILDCARDS -D__VER__=$TAG -D__DAY__=$DAY"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:${{ matrix.platform.mount }} \
          -w ${{ matrix.platform.mount }} \
          -e BUILD=${{ matrix.build-type }} \
          ${{ matrix.platform.image }} \
          /bin/sh -e 'aclocal && autoheader && automake -a && autoconf && \
          DAY=$(date +%d.%m.%Y) TAG=$(git describe --tags --abbrev=0) && \
          ./configure ${{ matrix.platform.cfg }}'
